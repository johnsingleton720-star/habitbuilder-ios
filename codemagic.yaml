workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          mkdir -p plugins/capacitor-auth-session/dist/esm
          python3 << 'PYEOF'
          import os
          os.makedirs('plugins/capacitor-auth-session/dist/esm', exist_ok=True)
          open('plugins/capacitor-auth-session/dist/esm/index.js', 'w').write(
            "import { registerPlugin } from '@capacitor/core';\n"
            "const AuthSession = registerPlugin('AuthSession', {\n"
            "    web: () => import('./web').then((m) => new m.AuthSessionWeb()),\n"
            "});\n"
            "export { AuthSession };\n"
          )
          open('plugins/capacitor-auth-session/dist/esm/web.js', 'w').write(
            "import { WebPlugin } from '@capacitor/core';\n"
            "export class AuthSessionWeb extends WebPlugin {\n"
            "    async start(options) {\n"
            "        window.location.href = options.url;\n"
            "        return { url: options.url };\n"
            "    }\n"
            "}\n"
          )
          print('Plugin dist files created successfully')
          PYEOF
          npm run build
      - name: Set app version
        script: |
          sed -i '' 's/"version": "[0-9]*\.[0-9]*\.[0-9]*"/"version": "1.2.1"/' package.json
          echo "App version set to 1.2.1 in package.json"
          grep '"version"' package.json
          sed -i '' "s/version: '[0-9]*\.[0-9]*\.[0-9]*'/version: '1.2.1'/" capacitor.config.ts
          echo "App version set to 1.2.1 in capacitor.config.ts"
          grep "version" capacitor.config.ts
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: |
          npx cap sync ios 2>&1 || echo "cap sync had warnings (expected - Podfile will be fixed next)"
          echo ""
          echo "=== Verifying Cordova plugin files ==="
          if [ -d "ios/App/App/plugins" ]; then
            ls -la ios/App/App/plugins/
            find ios/App/App/plugins/ -name "*purchase*" -o -name "*Purchase*" -o -name "*store*" -o -name "*Store*" 2>/dev/null
          else
            echo "WARNING: No plugins directory found"
          fi
          echo ""
          echo "=== Checking capacitor.cordova.podspec ==="
          cat ios/App/capacitor.cordova.podspec 2>/dev/null || echo "No cordova podspec found"
          echo ""
          echo "=== Cordova plugin list ==="
          find ios/ -path "*/cordova-plugin-purchase*" 2>/dev/null | head -20
        ignore_failure: true
      - name: Fix Podfile and install pods
        script: |
          cd ios/App
          sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/" Podfile
          ruby -i -pe '
            if /assertDeploymentTarget\(installer\)/ =~ $_
              $_ += "    installer.pods_project.targets.each do |target|\n"
              $_ += "      target.build_configurations.each do |config|\n"
              $_ += "        config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n"
              $_ += "        config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n"
              $_ += "      end\n"
              $_ += "    end\n"
            end
          ' Podfile
          ruby << 'PODRUBY'
          path = "Podfile"
          content = File.read(path)
          unless content.include?("FBSDKCoreKit")
            if content.include?("target 'App' do")
              content.sub!(/target 'App' do\n/, "target 'App' do\n  pod 'FBSDKCoreKit'\n")
              puts "Added FBSDKCoreKit after target 'App' do"
            else
              content.sub!(/^end\s*\z/, "  pod 'FBSDKCoreKit'\nend\n")
              puts "Added FBSDKCoreKit via fallback (before final end)"
            end
            raise "FBSDKCoreKit insertion failed - check Podfile format" unless content.include?("FBSDKCoreKit")
            File.write(path, content)
          else
            puts "FBSDKCoreKit already in Podfile"
          end
          PODRUBY
          echo "=== Final Podfile ==="
          cat Podfile
          echo ""
          echo "=== Fixing podspec name (CapacitorAuthSessionPlugin -> CapacitorAuthSession) ==="
          cp ../../plugins/capacitor-auth-session/CapacitorAuthSessionPlugin.podspec ../../plugins/capacitor-auth-session/CapacitorAuthSession.podspec
          sed -i '' "s/s.name = 'CapacitorAuthSessionPlugin'/s.name = 'CapacitorAuthSession'/" ../../plugins/capacitor-auth-session/CapacitorAuthSession.podspec
          echo "=== Installing pods ==="
          pod install
      - name: Fix App deployment target
        script: |
          cd ios/App
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' App.xcodeproj/project.pbxproj
          echo "=== Deployment targets after fix ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | sort -u
      - name: Set iOS version to 1.2.1
        script: |
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.2.1" App/Info.plist
          ruby << 'VERSIONRUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          project.targets.each do |target|
            next unless target.name == 'App'
            target.build_configurations.each do |config|
              config.build_settings['MARKETING_VERSION'] = '1.2.1'
              puts "Set MARKETING_VERSION = 1.2.1 for #{config.name}"
            end
          end
          project.save
          puts "Xcode project saved with version 1.2.1"
          VERSIONRUBY
          echo "=== Verify Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist
          echo "=== Verify project.pbxproj ==="
          grep "MARKETING_VERSION" App.xcodeproj/project.pbxproj
      - name: Add capabilities (IAP, Push Notifications) and StoreKit framework
        script: |
          cd ios/App

          cat > App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF

          ruby << 'PUSHRUBY'
          path = "App/AppDelegate.swift"
          content = File.read(path)
          if content.include?("capacitorDidRegisterForRemoteNotifications")
            puts "Push notification delegate methods already present in AppDelegate.swift"
          else
            push_methods = <<~SWIFT

              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
            SWIFT
            content.sub!(/\n\}\s*\z/, "\n#{push_methods}\n}\n")
            File.write(path, content)
            puts "Added push notification delegate methods to AppDelegate.swift"
          end
          PUSHRUBY

          ruby
