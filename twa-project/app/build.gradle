plugins {
    id 'com.android.application'
}

android {
    namespace 'pro.habitbuilder.app'
    compileSdk 34

    defaultConfig {
        applicationId "pro.habitbuilder.app"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName: "habitbuilder.pro",
            defaultUrl: "https://habitbuilder.pro",
            launcherName: "HabitBuilder",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "pro.habitbuilder.app", "sha256_cert_fingerprints": ["87:AF:FE:EB:3E:7E:2E:1B:D4:5A:58:C7:48:E2:75:FF:74:36:7F:C5:3C:51:EE:15:5E:41:B7:D7:F3:A0:A1:65"]}}]'
        ]
    }

    signingConfigs {
        release {
            storeFile file('../habitbuilder-keystore.jks')
            storePassword 'habitbuilder123'
            keyAlias 'habitbuilder'
            keyPassword 'habitbuilder123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
